<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="title desc"><title id="title">Coach dismissal causal diagram</title><desc id="desc">Squad strength and recent form affect both dismissal and future points. Dismissal affects tactics, which affects future points.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#17643a"/></marker></defs><g fill="#fff" stroke="#17231b" stroke-width="2"><rect x="20" y="22" width="145" height="44" rx="7"/><rect x="20" y="160" width="145" height="44" rx="7"/><rect x="290" y="91" width="155" height="44" rx="7"/><rect x="575" y="22" width="145" height="44" rx="7"/><rect x="575" y="160" width="145" height="44" rx="7"/></g><g font-family="system-ui" font-size="16" text-anchor="middle"><text x="92" y="49">Squad strength</text><text x="92" y="187">Recent form</text><text x="367" y="118">Coach dismissal</text><text x="647" y="49">Tactical change</text><text x="647" y="187">Future points</text></g><g stroke="#17643a" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M165 48L292 100"/><path d="M165 180L292 126"/><path d="M165 50Q410 205 575 184"/><path d="M165 180Q420 20 575 45"/><path d="M445 105L575 57"/><path d="M647 66L647 158"/></g></svg>
